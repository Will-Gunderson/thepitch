# Pages CMS configuration (https://pagescms.org)
# Paths are repo-relative. Static assets live under public/ so Astro copies them
# to the site root at build time, which is why input is public/images while the
# public URL (output) stays /images. Keep these in step if the layout moves.
media:
  input: public/images
  output: /images

content:
  - name: promo
    label: Promo Bar
    type: file
    path: public/content/promo.json
    format: json
    fields:
      - name: enabled
        label: Show the promo bar
        type: boolean
      - name: headline
        label: Top bar headline
        type: string
      - name: dropdown_heading
        label: Dropdown text (put a line break to split into two lines)
        type: text
      - name: bullets
        label: Bullet points
        type: string
        list: true
      - name: cta_label
        label: Button label
        type: string
